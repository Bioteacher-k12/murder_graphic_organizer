<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Graphic Organizer</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    #organizer-container {
      position: relative;
      display: inline-block;
    }
    #bg-img {
      max-width: 100%;
      display: block;
    }
    .text-box {
      position: absolute;
      min-width: 80px;
      min-height: 24px;
      padding: 4px 6px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px dashed #007bff;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }
    .btn-container {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1000;
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-print {
      background: #007bff;
      color: white;
    }
    .btn-clear {
      background: #dc3545;
      color: white;
    }
    @media print {
      .no-print {
        display: none !important;
      }
      .text-box {
        border: none;
        background: transparent;
      }
    }
  </style>
</head>
<body>

  <div class="btn-container no-print">
    <button class="btn btn-clear" onclick="clearAll()">Clear All</button>
    <button class="btn btn-print" onclick="window.print()">Save as PDF / Print</button>
  </div>

  <div id="organizer-container">
    <img src="CER_Organizer_1.png" id="bg-img" alt="Graphic Organizer">
  </div>

  <script>
    const container = document.getElementById('organizer-container');
    const bgImg = document.getElementById('bg-img');

    container.addEventListener('click', (e) => {
      if (e.target !== bgImg) return;

      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const textInput = document.createElement('div');
      textInput.className = 'text-box';
      textInput.contentEditable = 'true';
      textInput.style.left = `${x}px`;
      textInput.style.top = `${y}px`;

      // Auto-remove box if left empty when clicking away
      textInput.addEventListener('blur', () => {
        if (!textInput.innerText.trim()) {
          textInput.remove();
        }
      });

      // Double-click to delete any individual box
      textInput.addEventListener('dblclick', () => {
        textInput.remove();
      });

      container.appendChild(textInput);
      textInput.focus();
    });

    function clearAll() {
      if (confirm('Are you sure you want to clear all text boxes?')) {
        document.querySelectorAll('.text-box').forEach(box => box.remove());
      }
    }
  </script>

</body>
</html>
